  return head + '<details class="u-hist"' + (open ? " open" : "") + "><summary>Token history · " + fmtTokens(today.output) + " out today</summary>" +
    '<div class="u-stats"><div><b>' + today.messages + "</b><span>replies today</span></div><div><b>" + fmtTokens(today.output) + "</b><span>tokens out today</span></div>" +
      "<div><b>" + fmtTokens(u.totals.output) + "</b><span>tokens out · 30d</span></div><div><b>" + u.totals.sessions + "</b><span>sessions · 30d</span></div></div>" +
    '<div class="u-chart"><svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img" aria-label="Output tokens per day, last 30 days">' + bars + '<line x1="0" y1="' + (H - 0.5) + '" x2="' + W + '" y2="' + (H - 0.5) + '"/></svg>' +
      '<div class="u-tip" hidden></div><div class="u-axis"><span>' + label(u.days[0].date) + "</span><span>Output tokens per day</span><span>today</span></div></div>" +
    (u.projects.length ? '<div class="u-proj">' + u.projects.slice(0, 4).map((p) => "<span>" + esc(p.project) + " <b>" + fmtTokens(p.output) + "</b></span>").join("") + "</div>" : "") +
    '<details class="u-table"><summary>Table</summary><table><tr><th>Day</th><th>Replies</th><th>Tokens out</th></tr>' +
      u.days.slice().reverse().filter((d) => d.messages).map((d) => "<tr><td>" + label(d.date) + "</td><td>" + d.messages + "</td><td>" + d.output.toLocaleString() + "</td></tr>").join("") + "</table></details>" +
    "</details></div></section>";
}

  async search(params) {

    const modes = [["hybrid", "Best match"], ["semantic", "By meaning"], ["keyword", "Exact words"]];

      '<form class="searchbox" id="sf"><input id="sq" placeholder="Search by idea or by words… (&quot;quotes&quot; for exact phrases)" value="' + esc(q) + '" autofocus>' +

      '<div id="sr"></div>';

      const qv = $("#sq").value.trim(), fv = $("#sfo").value.trim(), tv = $("#sta").value.trim();

      const badge = (m) => m.includes("semantic") && m.includes("keyword") ? '<span class="pill accent">words + meaning</span>' : m.includes("semantic") ? '<span class="pill">meaning</span>' : "";

        : '<p class="faint">No results.</p>');
    };
    let timer;
    const deb = () => { clearTimeout(timer); timer = setTimeout(() => run().catch((e) => toast(e.message, true)), 220); };
    ["#sq", "#sfo", "#sta"].forEach((s) => $(s).addEventListener("input", deb));
    $("#sf").onsubmit = (e) => { e.preventDefault(); run(); };
    view.querySelectorAll("[data-mode]").forEach((a) => a.addEventListener("click", (e) => {
      e.preventDefault(); mode = a.dataset.mode;

  async tasks(params) {

    const query = { open: "status=open", overdue: "status=open&overdue=1", week: "status=open&due_after=" + t + "&due_before=" + shiftDate(t, 7), done: "status=done&limit=100" }[f] || "status=open";

    const groups = new Map();

      spaces +

        "<dt>Sync</dt><dd>" + (s.enabled ? "on" : '<span class="pill warn">off — run <code>brain init</code> on this folder to enable</span>') + "</dd>" +
        "<dt>Git repo</dt><dd>" + (s.repo ? "yes" : '<span class="pill danger">not a git repo</span>') + "</dd>" +
        "<dt>Remote</dt><dd>" + (s.remote ? "origin" : '<span class="pill warn">none — changes stay on this device</span>') + "</dd>" +
        "<dt>Branch</dt><dd>" + esc(s.branch || "—") + "</dd>" +
        "<dt>Unpushed</dt><dd>" + s.ahead + " commit" + (s.ahead === 1 ? "" : "s") + "</dd>" +
        "<dt>Behind</dt><dd>" + s.behind + "</dd>" +
        "<dt>Uncommitted</dt><dd>" + s.dirty.length + " file" + (s.dirty.length === 1 ? "" : "s") + "</dd>" +
        "<dt>Last pull</dt><dd>" + (s.lastPull ? ago(s.lastPull) : "never") + "</dd>" +
        "<dt>Last push</dt><dd>" + (s.lastPush ? ago(s.lastPush) : "never") + "</dd></dl></div></section>" +
      sec("Recent changes", recent.length, '<ul class="linklist">' + recent.map((e) => "<li><span>" + esc(e.subject.replace(/^\w+\([^)]*\):\s*/, "")) + '<span class="sub-line">' + esc(e.device || "outside the app") + " · " + ago(e.date) + "</span></span></li>").join("") + "</ul>", "No history yet.") +
      '</div><div class="stack">' +
      '<div class="section-label">Note checks' + (issues ? ' <span class="pill warn">' + issues + " to fix</span>" : ' <span class="pill ok">all good</span>') + "</div>" +
      sec("Missing link targets", r.unresolvedLinks.length, '<ul class="linklist">' + r.unresolvedLinks.map((u) => '<li><span><b>' + esc(u.target) + '</b> <span class="faint">×' + u.count + '</span><span class="sub-line">from ' + u.from.slice(0, 3).map((p) => '<a href="' + noteHref(p) + '">' + esc(p.split("/").pop().replace(/\.md$/, "")) + "</a>").join(", ") + (u.from.length > 3 ? " +" + (u.from.length - 3) : "") + "</span></span></li>").join("") + "</ul>", "Every link points to a real note.") +
      sec("Ambiguous names", r.ambiguousNames.length, '<ul class="linklist">' + r.ambiguousNames.map((a) => "<li><span><b>" + esc(a.name) + "</b>" + a.paths.map((p) => '<span class="sub-line">' + esc(p) + "</span>").join("") + "</span></li>").join("") + "</ul>", "No two notes share a name.") +
      sec("Frontmatter errors", r.frontmatterErrors.length, '<ul class="linklist">' + r.frontmatterErrors.map((e) => '<li><a href="' + noteHref(e.path) + '">' + esc(e.path) + '<span class="sub-line">' + esc(e.error) + "</span></a></li>").join("") + "</ul>", "All frontmatter parses.") +
      sec("Empty notes", r.emptyNotes.length, '<ul class="linklist">' + r.emptyNotes.map((p) => '<li><a href="' + noteHref(p) + '">' + esc(p) + "</a></li>").join("") + "</ul>", "None.") +
      '<section class="card"><div class="card-h">Semantic index</div><div class="card-b"><dl class="kv">' +
        "<dt>Model</dt><dd>" + (em.model ? esc(em.model) : '<span class="pill">off</span>') + "</dd>" +
        "<dt>Sections</dt><dd>" + em.embedded + " / " + em.total + " embedded" + (em.running ? ' <span class="pill accent">working…</span>' : "") + "</dd>" +
        (em.error ? '<dt>Problem</dt><dd><span class="pill danger">' + esc(em.error) + "</span></dd>" : "") + "</dl></div></section>" +
      "</div></div>";
    $("#sync-btn-2").onclick = () => doSync($("#sync-btn-2"));
  },
};

// ------------------------------------------------- keeping your place across Read/Edit
// Both modes are mapped onto source lines: the editor knows where every line is, the
// rendered note only where its headings are, so positions in between are interpolated.
let shownNote = null, keepPlace = null;

function switchMode(m) {
  const line = shownNote ? currentLine(shownNote) : null;
  keepPlace = line === null ? null : { path: shownNote.path, line };
  prefs.set("mode", m);
  route();
}

/** Line after the frontmatter and the title, and the headings below it (skipping code). */
function sourceOutline(content) {
  const lines = content.split("\n");
  let i = 0;
  if (lines[0] === "---") { const end = lines.indexOf("---", 1); if (end > 0) i = end + 1; }
  while (i < lines.length && !lines[i].trim()) i++;
  if (/^# /.test(lines[i] || "")) i++;
  const start = i, headings = [];
  let fence = null;
  for (; i < lines.length; i++) {
    const f = lines[i].match(/^\s*(`{3,}|~{3,})/);
    if (f) { if (!fence) fence = f[1][0]; else if (f[1][0] === fence) fence = null; continue; }
    const m = !fence && lines[i].match(/^(#{1,6})\s+(.*?)(?:\s+#+)?\s*$/);
    if (m) headings.push({ level: m[1].length, raw: m[2], text: m[2].toLowerCase(), line: i });
  }
  return { start, end: lines.length, headings };
}

/** Points tying page positions (y) in the rendered note to source lines. */
function readAnchors(n) {
  const body = $(".note-body");
  if (!body) return [];
  const y = (el) => el.getBoundingClientRect().top + scrollY;
  const { start, end, headings } = sourceOutline(n.content);
  const els = [...body.querySelectorAll("[data-heading]")];
  const pts = [{ y: y(body), line: start }];
  let j = 0;
  for (const h of headings) {
    const k = els.findIndex((el, idx) => idx >= j && el.dataset.heading.toLowerCase() === h.text);
    if (k < 0) continue;
    j = k + 1;
    pts.push({ y: y(els[k]), line: h.line });
  }
  pts.push({ y: y(body) + body.offsetHeight, line: end });
  return pts;
}

function lerp(pts, from, to, v) {
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    if (v > b[from] && i < pts.length - 1) continue;
    const span = b[from] - a[from];
    return a[to] + (span > 0 ? Math.min(1, Math.max(0, (v - a[from]) / span)) : 0) * (b[to] - a[to]);
  }
  return null;
}

/** Bottom of the sticky bars, in viewport pixels: where the visible note starts. */
function visibleTop(stuck) {
  const bar = $(".note-actions");
  if (!bar) return $(".topbar")?.offsetHeight || 0;
  return stuck ? (parseFloat(getComputedStyle(bar).top) || 0) + bar.offsetHeight : bar.getBoundingClientRect().bottom;
}

/** Source line (fractional) at the top of the visible note, or null if the note's start is in view. */
function currentLine(n) {
  const top = visibleTop(false);
  if (activeEditor?.view) {
    const v = activeEditor.view, h = top - v.documentTop;
    if (h <= 0) return null;
    const b = v.lineBlockAtHeight(h);
    return v.state.doc.lineAt(b.from).number - 1 + Math.min(1, Math.max(0, (h - b.top) / (b.height || 1)));
  }
  const pts = readAnchors(n);
  if (!pts.length || top + scrollY <= pts[0].y) return null;
  return lerp(pts, "y", "line", top + scrollY);
}

function restoreLine(n, line) {
  if (activeEditor?.view) {
    const v = activeEditor.view, doc = v.state.doc;
    const ln = doc.line(Math.min(doc.lines, Math.floor(line) + 1));
    v.dispatch({ selection: { anchor: ln.from } });
    // Heights of far-off lines are estimates until they're drawn, so settle once more after.
    const go = () => { const b = v.lineBlockAt(ln.from); scrollTo(0, v.documentTop + scrollY + b.top + (line % 1) * b.height - visibleTop(true)); };
    go();
    requestAnimationFrame(() => requestAnimationFrame(go));
  } else {
    const y = lerp(readAnchors(n), "line", "y", line);
    scrollTo(0, y === null ? 0 : y - visibleTop(true));
  }
}

/** "On this page": scroll to a heading from sourceOutline, in Read or Edit mode. */
function goToHeading(n, h) {
  if (activeEditor?.view) {
    // The text may have changed since the note loaded: find the heading nearest its old line.
    const doc = activeEditor.view.state.doc;
    let best = h.line, dist = Infinity;
    for (let i = 1; i <= doc.lines; i++) {
      const m = doc.line(i).text.match(/^#{1,6}\s+(.*?)(?:\s+#+)?\s*$/);
      if (m && m[1] === h.raw && Math.abs(i - 1 - h.line) < dist) { best = i - 1; dist = Math.abs(i - 1 - h.line); }
    }
    restoreLine(n, best);
    activeEditor.view.focus();
    return;
  }
  const y = lerp(readAnchors(n), "line", "y", h.line);
  if (y !== null) scrollTo({ top: y - visibleTop(true), behavior: "smooth" });
}

function jumpTo(heading) {
  const target = [...view.querySelectorAll(".prose [data-heading]")].find((el) => el.dataset.heading.toLowerCase() === heading.toLowerCase());
  if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
}

// ---------------------------------------------------------------- routing
let routeSeq = 0;
async function route() {
  const seq = ++routeSeq;
  const hash = location.hash.slice(1) || "/today";
  const [pathPart, query = ""] = hash.split("?");
  const params = new URLSearchParams(query);
  const [, name, ...rest] = pathPart.split("/");
  if (name === "health") { location.replace("#/sync"); return; } // the page used to be called Health
  if (activeEditor) { const ae = activeEditor; activeEditor = null; try { await ae.flush(); } catch {} ae.destroy(); }
  if (seq !== routeSeq) return;
  let key = views[name] ? name : isGuest() ? "notes" : "today";
  if (isGuest() && !["notes", "note", "search"].includes(key)) key = "notes";
  document.querySelectorAll("#nav a").forEach((a) => a.classList.toggle("active", a.dataset.r === key || (key === "note" && a.dataset.r === "notes")));
  if (!view.innerHTML.trim() || key !== view.dataset.view) view.innerHTML = '<div class="loading">One moment…</div>';
  view.dataset.view = key;
  document.body.dataset.view = key;
  try {
    await views[key](params, decodeURIComponent(rest.join("/")));
    if (seq === routeSeq) document.title = (key === "note" ? ($(".note-head h1")?.textContent || "Note") : key[0].toUpperCase() + key.slice(1)) + " · Shannote";
  } catch (e) {
    if (seq === routeSeq) view.innerHTML = '<div class="error-box">' + esc(e.message) + "</div>";
  }
}
window.addEventListener("hashchange", route);

// ---------------------------------------------------------------- global actions
document.addEventListener("click", (e) => {
  const pick = e.target.closest("[data-pick]");
  if (!pick) return;
  const input = pick.querySelector("input");
  try { input.showPicker(); } catch { input.focus(); input.click(); }
});
document.addEventListener("change", async (e) => {
  const el = e.target;
  if (el.dataset.task) {
    el.disabled = true;
    try { await api("task", { id: el.dataset.task, done: el.checked }); toast(el.checked ? "Done ✓" : "Reopened"); refreshCounts(); setTimeout(route, 350); }
    catch (err) { toast(err.message, true); el.checked = !el.checked; el.disabled = false; }
  } else if (el.dataset.due !== undefined && el.matches("input[type=date]")) {
    try { await api("task", { id: el.dataset.due, due: el.value || null }); toast(el.value ? "Due " + shortDate(el.value) : "Due date cleared"); refreshCounts(); route(); }
    catch (err) { toast(err.message, true); }
  }
});

$("#capture-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = $("#capture"); const text = input.value.trim();
  if (!text) return;
  input.disabled = true;
  try { const r = await api("capture", { text }); input.value = ""; toast("Captured to " + r.path.split("/").pop()); }
  catch (err) { toast(err.message, true); }
  finally { input.disabled = false; input.focus(); }
});

async function doSync(btn) {
  btn.disabled = true; const label = btn.textContent; btn.textContent = "Syncing…";
  try {
    const r = await api("sync", {});
    const pull = r.pull ? r.pull.status : "skipped";
    toast(pull === "no_remote" ? "No remote set up; changes are committed locally" : pull === "offline" ? "Couldn't reach the remote" : pull === "conflicts" ? "Synced with conflicts — see Health" : "Synced");
    refreshCounts(); route();
  } catch (err) { toast(err.message, true); }
  finally { btn.disabled = false; btn.textContent = label; }
}
$("#sync-btn").onclick = () => doSync($("#sync-btn"));

$("#theme-btn").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("brain-theme", root.dataset.theme); } catch {}
};
try { const t = localStorage.getItem("brain-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}

document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest(".cm-editor")) return;
  if (e.target.matches("input, textarea, select") || e.target.isContentEditable) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "Escape" && (voice.speaking || voice.listening)) { stopSpeaking(); if (voice.rec) voice.rec.abort(); return; }
  if (e.key === "[") { e.preventDefault(); setSideMin(!document.body.classList.contains("side-min")); return; }
  if (e.key === "m" && $("#chat-mic") && view.dataset.view === "today") { e.preventDefault(); toggleListening(); return; }
  if (e.key === "e" && $("#mode-seg")) { e.preventDefault(); switchMode(prefs.get("mode", "read") === "edit" ? "read" : "edit"); return; }
  if (e.key === "/") { e.preventDefault(); location.hash = "#/search"; }
  else if (e.key === "c" && !isGuest()) { e.preventDefault(); $("#capture").focus(); }
  else if (e.key === "t" && !isGuest()) location.hash = "#/today";
});

async function refreshCounts() {
  try {
    const s = await api("status");
    $("#c-inbox").textContent = s.inbox || "";
    const ct = $("#c-tasks"); ct.textContent = s.tasks.open;
    const td = $("#c-today"); td.textContent = s.tasks.overdue ? s.tasks.overdue + " overdue" : s.tasks.dueToday || ""; td.classList.toggle("alert", s.tasks.overdue > 0);
    const issues = s.unresolvedLinks; $("#c-health").textContent = issues || "";
    const y = s.sync, dot = $("#sync-dot"), txt = $("#sync-text");
    if (!y.enabled) { dot.className = "dot warn"; txt.textContent = s.device + " · sync off"; }
    else if (!y.repo) { dot.className = "dot bad"; txt.textContent = s.device + " · no git repo"; }
    else if (!y.remote) { dot.className = "dot warn"; txt.textContent = s.device + " · local only"; }
    else if (y.ahead || y.dirty.length) { dot.className = "dot warn"; txt.textContent = s.device + " · " + (y.ahead + y.dirty.length) + " to sync"; }
    else { dot.className = "dot ok"; txt.textContent = s.device + " · synced " + (y.lastPull ? ago(y.lastPull) : ""); }
  } catch (e) { $("#sync-text").textContent = "offline"; $("#sync-dot").className = "dot bad"; }
}

(async () => {
  try { me = await api("me"); } catch {}
  if (isGuest()) {
    document.body.classList.add("guest");
    $(".brand").insertAdjacentHTML("beforeend", '<span class="pill" style="margin-left:4px">guest</span>');
  }
  await route();
  loadExplorer(true);
  if (!isGuest()) { refreshCounts(); setInterval(refreshCounts, 30000); }
})();
</script>
